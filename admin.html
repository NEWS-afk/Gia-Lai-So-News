<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tòa soạn | Gia Lai Số News</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
<section id="loginScreen" class="admin-shell">
  <form id="loginForm" class="login-card">
    <h1>Tòa soạn</h1>
    <p>Đăng nhập để quản lý và đăng bài.</p>
    <div class="field"><label>Tài khoản</label><input id="loginUsername" autocomplete="username" value="Admin" required></div>
    <div class="field"><label>Mật khẩu</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
    <div id="loginError" class="form-error"></div>
    <button class="btn red" type="submit">Đăng nhập</button>
    <p class="inline-note">Mật khẩu được xác thực bởi Firebase Authentication, không lưu trong mã nguồn website.</p>
    <p class="inline-note" style="font-weight:700;color:#555">Bản kiểm tra đăng nhập: 26/10/2026 - 17:15</p>
  </form>
</section>

<section id="dashboard" class="dashboard">
  <header class="admin-header">
    <div class="container admin-header-inner">
      <strong>GIA LAI SỐ NEWS · TÒA SOẠN</strong>
      <div><a href="index.html" target="_blank">Xem trang</a> &nbsp; <button id="logoutBtn" class="btn light">Đăng xuất</button></div>
    </div>
  </header>
  <main class="admin-main">
    <aside class="admin-panel">
      <div class="admin-toolbar">
        <button id="newPostBtn" class="btn red">+ Bài mới</button>
        <button id="seedBtn" class="btn light">Khởi tạo 72 bài mẫu V10</button>
        <button id="syncPcccBtn" class="btn light">Cập nhật 16 bài PCCC Ia Ko</button>
      </div>
      <input id="adminSearch" class="admin-search" placeholder="Tìm bài...">
      <div id="adminStats" class="stats"></div>
      <div id="postList" class="post-list"></div>
    </aside>

    <section class="admin-panel">
      <h2 id="editorTitle">Bài viết mới</h2>
      <form id="postForm">
        <input id="postId" type="hidden">
        <div class="form-grid">
          <div class="field full"><label>Tiêu đề</label><input id="title" required></div>
          <div class="field"><label>Chuyên mục</label><select id="category">
            <option>Pháp luật</option><option>PCCC</option><option>Cảnh báo ANTT</option><option>Chuyển đổi số</option><option>Tin thế giới</option>
          </select></div>
          <div class="field"><label>Ngày đăng</label><input id="date" type="date" required></div>
          <div class="field"><label>Tác giả</label><input id="author" value="Gia Lai Số News"></div>
          <div class="field"><label>Trạng thái</label><select id="status"><option value="published">Đăng công khai</option><option value="draft">Bản nháp</option></select></div>
          <div class="field full"><label>Tóm tắt</label><textarea id="excerpt" required></textarea></div>
          <div class="field full"><label>Nội dung</label><textarea id="content" style="min-height:300px" required></textarea></div>
          <div class="field"><label>Đơn vị phối hợp (nếu có)</label><input id="partner" placeholder="Ví dụ: Công an xã Ia Ko"></div>
          <div class="field"><label>Ảnh đại diện - URL/đường dẫn</label><input id="imageUrl" placeholder="https://... hoặc images/..."></div>
          <div class="field full storage-box">
            <label>Hoặc tải ảnh trực tiếp</label>
            <input id="imageFile" type="file" accept="image/*">
            <div id="storageNote" class="inline-note"></div>
          </div>
          <div class="field full"><label>Nguồn tham khảo (mỗi dòng: Tên nguồn | URL)</label><textarea id="sources" placeholder="Bộ Công an | https://bocongan.gov.vn/"></textarea></div>
          <div class="field"><label><input id="featured" type="checkbox"> Tin nổi bật</label></div>
        </div>
        <div id="saveError" class="form-error"></div>
        <div class="admin-toolbar">
          <button class="btn red" type="submit">Lưu bài</button>
          <button id="deleteBtn" class="btn danger" type="button">Xóa bài</button>
        </div>
      </form>
    </section>
  </main>
</section>

<script src="seed-posts.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="admin.js?v=20261026-1715"></script>
</body>
</html>
