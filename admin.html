<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản trị bài viết | Gia Lai Số News</title>
<link rel="stylesheet" href="styles.css">
<style>
.admin-wrap{padding:28px 0 50px}.admin-top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.admin-top h1{margin:0;font-family:Georgia,serif}.admin-grid{display:grid;grid-template-columns:390px 1fr;gap:20px}.panel{background:#fff;border:1px solid #e2e5e9;padding:18px}.form-row{margin-bottom:12px}.form-row label{font-weight:700;font-size:13px;display:block;margin-bottom:5px}.form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid #d8dde6;padding:9px;font:inherit}.form-row textarea{min-height:110px}.btn{border:0;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:#9b1c20;color:#fff}.secondary{background:#eceff2}.danger{background:#fde8e8;color:#9b1c20}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.list{max-height:720px;overflow:auto}.item{padding:10px 6px;border-bottom:1px solid #eceff3;cursor:pointer}.item:hover{background:#f8f9fa}.item strong{display:block;font-size:14px}.tiny{font-size:12px;color:#667085}.warn{background:#fff7dd;border:1px solid #f3df9e;padding:10px;font-size:13px;margin-bottom:14px}.search-admin{width:100%;padding:9px;border:1px solid #d8dde6;margin:10px 0}.status-box{font-size:12px;color:#5f6670;margin-bottom:10px}.month-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}.month-grid span{font-size:10px;text-align:center;padding:4px;background:#eef1f4}.month-grid span.ok{background:#e4f3e8;color:#19692c}.preview-img{width:100%;max-height:220px;object-fit:cover;border:1px solid #eceff3;margin-top:6px;background:#f7f8fa}code{background:#f4f4f4;padding:1px 4px}@media(max-width:900px){.admin-grid{grid-template-columns:1fr}.admin-top{display:block}}
</style>
</head>
<body>
<div class="utility-bar"><div class="container utility-inner"><span>QUẢN TRỊ NỘI DUNG</span><a href="index.html" style="color:#9b1c20;font-weight:700">← Về trang chủ</a></div></div>
<main class="container admin-wrap">
<div class="admin-top"><div><h1>Gia Lai Số News</h1><div class="tiny">Quản lý kho bài viết và xuất lại dữ liệu website</div></div></div>
<div class="warn"><strong>Lưu ý:</strong> Website công khai trên Internet. Không đưa tài liệu mật, dữ liệu nghiệp vụ hoặc thông tin cá nhân nhạy cảm lên trang.</div>
<div class="toolbar"><button id="newBtn" class="btn secondary">+ Bài mới</button><button id="exportBtn" class="btn primary">Xuất articles.json</button><label class="btn secondary">Nhập JSON<input id="importFile" type="file" accept=".json" hidden></label></div>
<div class="admin-grid">
<section class="panel">
<h3 style="margin-top:0">Danh sách bài</h3>
<input id="adminSearch" class="search-admin" placeholder="Tìm theo tiêu đề hoặc chuyên mục...">
<div id="status" class="status-box"></div>
<div id="pcccMonths" class="month-grid"></div>
<div id="list" class="list"></div>
</section>
<section class="panel">
<h3 id="formTitle" style="margin-top:0">Chỉnh sửa bài</h3>
<form id="form">
<input type="hidden" id="id">
<div class="form-row"><label>Tiêu đề</label><input id="title" required></div>
<div class="form-row"><label>Chuyên mục</label><select id="category"><option>Pháp luật</option><option>PCCC</option><option>Cảnh báo ANTT</option><option>Chuyển đổi số</option><option>Tin thế giới</option></select></div>
<div class="form-row"><label>Ngày đăng</label><input id="date" type="date" required></div>
<div class="form-row"><label>Tác giả</label><input id="author" value="Gia Lai Số News"></div>
<div class="form-row"><label>Đơn vị phối hợp (để trống nếu không có)</label><input id="partner" placeholder="Ví dụ: Công an xã Ia Ko"></div>
<div class="form-row"><label>Mô tả ngắn</label><textarea id="excerpt" required></textarea></div>
<div class="form-row"><label>Nội dung bài (mỗi đoạn cách nhau 1 dòng trống)</label><textarea id="content" style="min-height:300px" required></textarea></div>
<div class="form-row"><label>Ảnh đại diện (đường dẫn tương đối)</label><input id="image" placeholder="images/covers/ten-anh.jpg"></div>
<div class="form-row"><label>Gallery ảnh (mỗi dòng 1 đường dẫn)</label><textarea id="gallery" style="min-height:80px"></textarea></div>
<div class="form-row"><label>Nguồn tham khảo (mỗi dòng theo dạng: Tên nguồn | https://...)</label><textarea id="sources" style="min-height:95px"></textarea></div>
<div class="form-row"><label><input id="featured" type="checkbox" style="width:auto"> Đánh dấu bài nổi bật trang chủ</label></div>
<img id="preview" class="preview-img" style="display:none" alt="Xem trước ảnh">
<div class="toolbar" style="margin-top:14px"><button class="btn primary" type="submit">Lưu vào bản nháp</button><button id="deleteBtn" class="btn danger" type="button">Xóa bài</button></div>
</form>
</section>
</div>
</main>
<script>
let articles=[];const $=s=>document.querySelector(s);
async function init(){articles=await(await fetch('data/articles.json')).json();bind();renderList();newForm()}
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,85)}
function bind(){$('#adminSearch').oninput=renderList;$('#image').oninput=showPreview;$('#newBtn').onclick=newForm;$('#deleteBtn').onclick=deleteCurrent;$('#exportBtn').onclick=exportJson;$('#importFile').onchange=importJson;$('#form').onsubmit=saveForm}
function renderList(){const q=$('#adminSearch').value.trim().toLowerCase();const filtered=[...articles].sort((a,b)=>b.date.localeCompare(a.date)).filter(a=>!q||(a.title+' '+a.category+' '+(a.partner||'')).toLowerCase().includes(q));const counts={};articles.forEach(a=>counts[a.category]=(counts[a.category]||0)+1);$('#status').textContent=`${articles.length} bài · PL ${counts['Pháp luật']||0} · PCCC ${counts.PCCC||0} · ANTT ${counts['Cảnh báo ANTT']||0} · CĐS ${counts['Chuyển đổi số']||0} · TG ${counts['Tin thế giới']||0}`;$('#list').innerHTML=filtered.map(a=>`<div class="item" data-id="${a.id}"><strong>${a.title}</strong><span class="tiny">${a.date} · ${a.category}${a.partner?' · '+a.partner:''}</span></div>`).join('');document.querySelectorAll('.item').forEach(x=>x.onclick=()=>edit(x.dataset.id));renderMonths()}
function renderMonths(){const months=[];for(let y=2025;y<=2026;y++)for(let m=1;m<=12;m++)months.push(`${y}-${String(m).padStart(2,'0')}`);const active=months.filter(x=>x>='2025-11'&&x<='2026-10');$('#pcccMonths').innerHTML=active.map(x=>{const ok=articles.some(a=>a.category==='PCCC'&&a.date.startsWith(x));return `<span class="${ok?'ok':''}">${x.slice(5)}/${x.slice(2,4)} ${ok?'✓':'—'}</span>`}).join('')}
function newForm(){$('#form').reset();$('#id').value='';$('#date').value=new Date().toISOString().slice(0,10);$('#author').value='Gia Lai Số News';$('#formTitle').textContent='Thêm bài mới';showPreview()}
function edit(id){const a=articles.find(x=>x.id===id);if(!a)return;$('#id').value=a.id;$('#title').value=a.title;$('#category').value=a.category;$('#date').value=a.date;$('#author').value=a.author||'';$('#partner').value=a.partner||'';$('#excerpt').value=a.excerpt||'';$('#content').value=a.content||'';$('#featured').checked=!!a.featured;$('#image').value=a.image||'';$('#gallery').value=(a.gallery||[]).join('\n');$('#sources').value=(a.sources||[]).map(s=>`${s.name} | ${s.url}`).join('\n');$('#formTitle').textContent='Chỉnh sửa bài';showPreview()}
function parseSources(){return $('#sources').value.split(/\n+/).map(s=>s.trim()).filter(Boolean).map(line=>{const i=line.indexOf('|');return i>=0?{name:line.slice(0,i).trim(),url:line.slice(i+1).trim()}:{name:line,url:''}})}
function saveForm(e){e.preventDefault();let id=$('#id').value||slug($('#title').value)+'-'+Date.now().toString().slice(-5);if($('#featured').checked)articles.forEach(a=>a.featured=false);const obj={id,title:$('#title').value.trim(),category:$('#category').value,date:$('#date').value,author:$('#author').value.trim()||'Gia Lai Số News',partner:$('#partner').value.trim()||null,excerpt:$('#excerpt').value.trim(),content:$('#content').value.trim(),featured:$('#featured').checked,image:$('#image').value.trim(),gallery:$('#gallery').value.split(/\n+/).map(s=>s.trim()).filter(Boolean),sources:parseSources()};const i=articles.findIndex(x=>x.id===id);if(i>=0)articles[i]=obj;else articles.push(obj);$('#id').value=id;renderList();alert('Đã lưu vào bản nháp. Khi chỉnh xong, bấm “Xuất articles.json” để cập nhật lên GitHub.')}
function deleteCurrent(){const id=$('#id').value;if(!id)return;if(confirm('Xóa bài này khỏi bản nháp?')){articles=articles.filter(a=>a.id!==id);newForm();renderList()}}
function exportJson(){const blob=new Blob([JSON.stringify(articles,null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='articles.json';a.click();URL.revokeObjectURL(a.href)}
function importJson(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{articles=JSON.parse(r.result);renderList();alert('Đã nhập dữ liệu vào bản nháp.')}catch{alert('File JSON không hợp lệ.')}};r.readAsText(f)}
function showPreview(){const v=$('#image').value.trim();if(v){$('#preview').src=v;$('#preview').style.display='block'}else $('#preview').style.display='none'}
init().catch(()=>alert('Hãy mở trang quản trị trên website/GitHub Pages, không mở trực tiếp bằng file://.'));
</script>
</body></html>
